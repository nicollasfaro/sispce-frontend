<div class="container mt-4" *ngIf="candidato">
  <div class="card shadow-sm">
    <div class="card-header bg-warning text-dark">
      <h4 class="mb-0">Editar Candidato</h4>
    </div>
    <div class="card-body">
      <form>
        
        <!-- Dados Pessoais -->
        <h5 class="mb-3">Dados Pessoais</h5>
        <div class="row">
          <div class="col-md-6 mb-3">
            <label>Nome</label>
            <input class="form-control" [(ngModel)]="candidato.nome" name="nome">
          </div>
          <div class="col-md-6 mb-3">
            <label>Naturalidade</label>
            <input class="form-control" [(ngModel)]="candidato.naturalidade" name="naturalidade">
          </div>
          <div class="col-md-6 mb-3">
            <label>Data de Nascimento</label>
            <input type="date" class="form-control" [(ngModel)]="candidato.dataDeNascimento" name="dataDeNascimento">
          </div>
          <div class="col-md-6 mb-3">
            <label>Estado Civil</label>
            <select class="form-control" [(ngModel)]="candidato.estadoCivil" name="estadoCivil">
              <option value="SOLTEIRO">Solteiro</option>
              <option value="CASADO">Casado</option>
              <option value="DIVORCIADO">Divorciado</option>
              <option value="VIUVO">Viúvo</option>
            </select>
          </div>
          <div class="col-md-6 mb-3">
            <label>Email</label>
            <input class="form-control" [(ngModel)]="candidato.email" name="email">
          </div>
          <div class="col-md-6 mb-3">
            <label>Celular</label>
            <input class="form-control" [(ngModel)]="candidato.celular" name="celular">
          </div>
        </div>

        <!-- Informações Militares -->
        <h5 class="mb-3">Informações Militares</h5>
        <div class="row">
          <div class="col-md-6 mb-3">
            <label>Posto</label>
            <input class="form-control" [(ngModel)]="candidato.posto" name="posto">
          </div>
          <div class="col-md-6 mb-3">
            <label>Organização Militar</label>
            <input class="form-control" [(ngModel)]="candidato.organizacaoMilitar.nomeInstituicao" name="omNomeInstituicao">
          </div>
          <div class="col-md-4 mb-3">
            <label>Sigla OM</label>
            <input class="form-control" [(ngModel)]="candidato.organizacaoMilitar.sigla" name="omSigla">
          </div>
          <div class="col-md-4 mb-3">
            <label>CODOM</label>
            <input class="form-control" [(ngModel)]="candidato.organizacaoMilitar.codom" name="omCodom">
          </div>
          <div class="col-md-4 mb-3">
            <label>Tempo de Guarnição</label>
            <input type="number" class="form-control" [(ngModel)]="candidato.tempoGuarnicao" name="tempoGuarnicao">
          </div>
        </div>

        <!-- Situação -->
        <h5 class="mb-3">Situação</h5>
        <div class="row">
          <div class="col-md-3 mb-3">
            <label>Inspeção de Saúde</label>
            <input class="form-control" [(ngModel)]="candidato.inspecaoSaude" name="inspecaoSaude">
          </div>
          <div class="col-md-3 mb-3">
            <label>Movimentado</label>
            <select class="form-control" [(ngModel)]="candidato.movimentado" name="movimentado">
              <option [ngValue]="true">Sim</option>
              <option [ngValue]="false">Não</option>
            </select>
          </div>
          <div class="col-md-3 mb-3">
            <label>Sub Judice</label>
            <select class="form-control" [(ngModel)]="candidato.subJudice" name="subJudice">
              <option [ngValue]="true">Sim</option>
              <option [ngValue]="false">Não</option>
            </select>
          </div>
          <div class="col-md-3 mb-3">
            <label>Designado/Matriculado</label>
            <select class="form-control" [(ngModel)]="candidato.designadoOrMatriculado" name="designadoOrMatriculado">
              <option [ngValue]="true">Sim</option>
              <option [ngValue]="false">Não</option>
            </select>
          </div>
        </div>

        <!-- Botões -->
        <div class="mt-3">
          <button type="button" class="btn btn-primary" (click)="salvar()">
            💾 Salvar
          </button>
          <button type="button" class="btn btn-secondary" (click)="cancelar()">
            ❌ Cancelar
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
