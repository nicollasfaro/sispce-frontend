<div class="container mt-4">
  <h3>Candidatos</h3>

  <table class="table table-striped mt-3" *ngIf="candidatos.length > 0; else semDados">
    <thead>
      <tr>
        <th>Nome</th>
        <th>Email</th>
        <th>Posto</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let candidato of candidatos">
        <td>{{ candidato.nome }}</td>
        <td>{{ candidato.email }}</td>
        <td>{{ candidato.posto }}</td>
        <td>
          <button class="btn btn-info btn-sm" (click)="visualizar(candidato)">Ver</button>
          <button class="btn btn-warning btn-sm" (click)="editar(candidato)">Editar</button>
          <button class="btn btn-danger btn-sm" (click)="excluir(candidato.id)">Excluir</button>
        </td>
      </tr>
    </tbody>
  </table>

  <ng-template #semDados>
    <p>Nenhum candidato encontrado.</p>
  </ng-template>
</div>

<ng-template #acessoNegado>
  <div class="alert alert-danger mt-4">
    Você não tem permissão para acessar esta página.
  </div>
</ng-template>
