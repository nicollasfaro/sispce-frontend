<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card mt-5 shadow">
        <div class="card-header text-center bg-primary text-white" style="height: 60px;">
          <h3>SisPCE</h3>
        </div>
        <div class="card-body text-center">
          <!-- Mensagem de orientação -->
          <h5 class="mb-3">Acesso Restrito</h5>
          <p class="text-muted">
            Utilize o botão abaixo para entrar com seu <strong>login DGP</strong>.
          </p>

          <!-- Login com DGP -->
          <button
            type="button"
            class="btn btn-success w-100"
            (click)="onLoginWithDgp()"
          >
            <i class="fas fa-id-card"></i> Login com DGP
          </button>

          <!-- Mensagem de erro -->
          <div *ngIf="errorMessage" class="alert alert-danger mt-3">
            {{ errorMessage }}
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
