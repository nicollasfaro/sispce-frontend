<div class="container mt-5 d-flex justify-content-center">
  <div class="card shadow-lg p-4 text-center" style="max-width: 500px; width: 100%;">
    <div class="card-body">
      <h2 class="text-danger mb-3">🚫 Acesso Negado</h2>
      <p class="lead">
        Você não tem permissão para acessar esta página.
      </p>

      <hr />

      <p class="text-muted">
        Caso você seja um <strong>candidato</strong> ao sistema,
        aguarde a aprovação do seu perfil de acesso pelo administrador.
      </p>

      <button class="btn btn-primary mt-3" routerLink="/">
        Voltar para a Página Inicial
      </button>

      <!-- Botão aparece somente se estiver logado -->
      <button 
        *ngIf="isLoggedIn" 
        class="btn btn-outline-success mt-3 ms-2"
        (click)="solicitarAcesso()"
        [disabled]="loading">
        {{ loading ? 'Enviando...' : 'Solicitar Acesso' }}
      </button>

      <!-- Mensagem de retorno -->
      <div *ngIf="message" class="alert alert-info mt-3">
        {{ message }}
      </div>
    </div>
  </div>
</div>
