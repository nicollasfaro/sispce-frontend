<h2 mat-dialog-title>Solicitações Pendentes</h2>
<mat-dialog-content>
  <div *ngFor="let s of solicitacoes" class="mb-3 border p-2 rounded">
    <p>
      <strong>{{ s.nomeMilitar }}</strong> ({{ s.postoGradSigla }} -
      {{ s.nomeGuerra }})
    </p>
    <p>{{ s.omSigla }} - {{ s.omNome }}</p>
    <p>
      <small>Solicitado em: {{ s.dataSolicitacao | date : "short" }}</small>
    </p>

    <mat-form-field appearance="outline" class="w-100">
      <mat-label>Role</mat-label>
      <mat-select #role="matSelect" required>
        <mat-option *ngFor="let r of rolesDisponiveis" [value]="r.roleId">
          {{ r.name }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <button
      mat-raised-button
      color="primary"
      [disabled]="!role.value"
      (click)="aprovar(s.solicitacaoId, role.value)"
    >
      Aprovar
    </button>
  </div>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Fechar</button>
</mat-dialog-actions>
